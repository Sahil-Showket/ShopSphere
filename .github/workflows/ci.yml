name: ShopSphere CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: auth-service
            db: shopsphere_auth
          - service: product-service
            db: shopsphere_product
          - service: cart-service
            db: shopsphere_cart
          - service: order-service
            db: shopsphere_order
          - service: payment-service
            db: shopsphere_payment
          - service: notification-service
            db: shopsphere_notification

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopsphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d shopsphere_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ matrix.db }}
      JWT_SECRET: shopsphere_ci_test_secret
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://guest:guest@localhost:5672

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create test database
        run: |
          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d postgres \
            -c "CREATE DATABASE ${{ matrix.db }};"

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test